    <style>
        :root {
            --text: #1a1a1a;
            --text-secondary: #7a756d;
            --text-tertiary: #9a9590;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; }
        ::selection { background: rgba(193,154,73,0.3); }

        body {
            background: #f5f4f0;
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", system-ui, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 3rem;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        main {
            max-width: 40rem;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Entrance. */
        .hero, .contact-nav {
            opacity: 0;
            transform: translateY(12px);
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .hero { animation-delay: 0.1s; }
        .contact-nav { animation-delay: 0.45s; }

        @keyframes vt-out { to { opacity: 0; transform: translateY(-8px); } }
        @keyframes vt-in { from { opacity: 0; transform: translateY(8px); } }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* The icons rise into the dock one at a time, on the `translate`
           property so the entrance never fights the launch bounce. */
        @media (prefers-reduced-motion: no-preference) {
            .dock-icon img { animation: icon-in 0.7s cubic-bezier(0.34, 1.4, 0.64, 1) backwards; }
            .dock-icon:nth-child(1) img { animation-delay: 0.28s; }
            .dock-icon:nth-child(2) img { animation-delay: 0.34s; }
            .dock-icon:nth-child(3) img { animation-delay: 0.40s; }
            .dock-icon:nth-child(4) img { animation-delay: 0.46s; }
            .dock-icon:nth-child(5) img { animation-delay: 0.52s; }
            .dock-icon:nth-child(6) img { animation-delay: 0.58s; }
            .dock-icon.running::before { animation: dot-in 0.4s ease 1.1s backwards; }
        }
        @keyframes icon-in {
            from { translate: 0 22px; scale: 0.82; opacity: 0; }
            40% { opacity: 1; }
        }
        @keyframes dot-in { from { opacity: 0; } }

        .hero-name {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", system-ui, "Helvetica Neue", Arial, sans-serif;
            font-size: clamp(3rem, 7.5vw, 4.5rem);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -0.03em;
            color: var(--text);
        }

        .hero-sub {
            margin-top: 0.75rem;
            font-size: 1rem;
            font-weight: 400;
            color: var(--text-tertiary);
            letter-spacing: 0.015em;
        }

        /* ============================================
           DOCK — bare app icons, macOS-style magnification
           ============================================ */
        .dock-section {
            margin-top: 4.25rem;
            display: flex;
            justify-content: center;
        }

        /* The row keeps a fixed height: magnified icons grow upward out
           of it, so nothing below ever moves. The padding above is the
           hover zone, so sliding between two enlarged icons never counts
           as leaving the dock. */
        .dock {
            --size: 56px;
            --gap: 14px;
            box-sizing: content-box;
            height: var(--size);
            padding-top: 48px;
            margin-top: -48px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: var(--gap);
        }

        /* --m is the magnification (1 at rest). JS drives it from the
           pointer's distance; keyboard focus sets it in CSS. */
        .dock-icon {
            --m: 1;
            position: relative;
            flex: none;
            display: block;
            width: calc(var(--size) * var(--m));
            height: calc(var(--size) * var(--m));
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }

        .dock-icon img {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 22.5%;
            box-shadow:
                0 0 0 0.5px rgba(0,0,0,0.06),
                0 6px 18px rgba(60,50,30,0.14),
                0 1px 4px rgba(60,50,30,0.09);
            -webkit-user-drag: none; user-select: none;
            transition: scale 0.12s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .dock-icon:active img { scale: 0.94; }

        /* Running indicator, as under an open app in the Dock */
        .dock-icon.running::before {
            content: '';
            position: absolute;
            left: 50%;
            bottom: -10px;
            width: 4px;
            height: 4px;
            margin-left: -2px;
            border-radius: 50%;
            background: var(--text-tertiary);
        }

        /* Launch: clicking an icon bounces it like a macOS dock launch
           while its site opens in a new tab, two hops on the `translate`
           property, up on an out-ease, down on an in-ease. */
        @media (prefers-reduced-motion: no-preference) {
            .dock-icon.launch img { animation: launch 0.95s linear; }
        }
        @keyframes launch {
            0% { translate: 0 0; animation-timing-function: cubic-bezier(0.2, 0.7, 0.4, 1); }
            28% { translate: 0 -22px; animation-timing-function: cubic-bezier(0.6, 0, 0.8, 0.4); }
            50% { translate: 0 0; animation-timing-function: cubic-bezier(0.2, 0.7, 0.4, 1); }
            67% { translate: 0 -9px; animation-timing-function: cubic-bezier(0.6, 0, 0.8, 0.4); }
            82%, 100% { translate: 0 0; }
        }

        /* Keyboard focus gets the hover treatment: the icon grows and
           says its name. */
        .dock-icon:focus-visible { outline: none; --m: 1.3; }
        .dock-icon:focus-visible img {
            outline: 2px solid var(--text);
            outline-offset: 3px;
        }

        /* For screen readers and crawlers only: never rendered visually */
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            margin: -1px;
            padding: 0;
            overflow: hidden;
            clip: rect(0 0 0 0);
            clip-path: inset(50%);
            white-space: nowrap;
            border: 0;
        }

        /* Label — minimal frosted pill above the icon */
        .dock-icon::after {
            content: attr(data-label);
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", system-ui, "Helvetica Neue", Arial, sans-serif;
            font-size: 0.6875rem;
            font-weight: 500;
            letter-spacing: 0.01em;
            color: var(--text);
            background: rgba(255,255,255,0.72);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            backdrop-filter: blur(20px) saturate(1.4);
            padding: 4px 10px;
            border-radius: 6px;
            white-space: nowrap;
            opacity: 0;
            translate: 0 4px;
            pointer-events: none;
            transition: opacity 0.12s ease, translate 0.12s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 0.5px solid rgba(255,255,255,0.5);
        }
        .dock-icon:hover::after,
        .dock-icon:focus-visible::after {
            opacity: 1;
            translate: 0 0;
            transition: opacity 0.16s ease 0.05s,
                        translate 0.22s cubic-bezier(0.34, 1.4, 0.64, 1) 0.05s;
        }

        /* Contact */
        .contact-nav {
            margin-top: 2.75rem;
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .contact-nav a {
            color: var(--text-tertiary);
            text-decoration: none;
            font-size: 0.8125rem;
            font-weight: 400;
            transition: color 0.3s ease;
        }


        .contact-nav a:hover,
        .contact-nav a:focus-visible { color: var(--text); }

        /* ============================================
           DARK MODE
           ============================================ */
        @media (prefers-color-scheme: dark) {
            :root {
                --text: #e8e6e1;
                --text-secondary: #9a9590;
                --text-tertiary: #6e6a64;
            }
            body { background: #111110; }
            ::selection { background: rgba(235,200,120,0.22); }


            .dock-icon img {
                box-shadow: 0 6px 18px rgba(0,0,0,0.45), 0 1px 4px rgba(0,0,0,0.25), 0 0 0 0.5px rgba(255,255,255,0.16);
            }

            .dock-icon::after {
                background: rgba(50,47,44,0.72);
                border-color: rgba(255,255,255,0.1);
                box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .hero, .contact-nav {
                opacity: 1; transform: none; animation: none;
            }
            .dock-icon img { transition: none; animation: none; }
            .dock-icon::after { transition: none; translate: 0 0; }
            .dock-icon:focus-visible { --m: 1; }
            .contact-nav a { transition: none; }
        }

        /* Mobile */
        @media (max-width: 480px) {
            body { padding: 1.5rem; }
            .hero-name { font-size: clamp(2rem, 10vw, 2.5rem); }
            .hero-sub { font-size: 0.875rem; }
            .dock-section { margin-top: 3.25rem; }
            .dock {
                --gap: 10px;
                --size: clamp(36px, calc((100vw - 3rem - 5 * var(--gap)) / 6), 52px);
            }
            .contact-nav { margin-top: 2.25rem; gap: 1.5rem; }
        }

        @media (hover: none) {
            .dock-icon::after { display: none; }
        }

        /* Site-wide details: soft cross-page transitions, typographic wrapping.
           The name and subtitle carry shared view-transition-names with the
           about page, so they physically glide between the two while the
           rest of the page fades. */
        @view-transition { navigation: auto; }
        @media (prefers-reduced-motion: no-preference) {
            ::view-transition-old(root) { animation: vt-out 0.25s cubic-bezier(0.16, 1, 0.3, 1) both; }
            ::view-transition-new(root) { animation: vt-in 0.25s cubic-bezier(0.16, 1, 0.3, 1) both; }
            .hero-name { view-transition-name: hero-name; }
            .hero-sub { view-transition-name: hero-sub; }
            ::view-transition-group(hero-name),
            ::view-transition-group(hero-sub) {
                animation-duration: 0.3s;
                animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
            }
        }
        h1, h2, h3 { text-wrap: balance; }
        p { text-wrap: pretty; }
    </style>

    <script>
        const late = new Date().getHours() < 5;
        console.log('%c' + (late ? '\u{1F319}' : '\u{1F44B}'), 'font-size: 48px');
        console.log(
            '%c' + (late ? 'You\'re up late. So are the ghosts.' : 'Hey, you\'re curious. I like that.') +
            '%c\n\nBuilt by Erik\nerik@fluencify.io',
            'color: #1a1a1a; font-size: 14px; font-weight: 600; font-family: system-ui, -apple-system, sans-serif;',
            'color: #9a9590; font-size: 12px; font-family: system-ui, -apple-system, sans-serif;'
        );
        console.log('%cPS: the moon in /graveyard does something. and this is a shell. try ls().',
            'color: #9a9590; font-size: 12px; font-style: italic; font-family: system-ui, -apple-system, sans-serif;');

        // Easter egg: select the name, get a nod.
        let named = false;
        document.addEventListener('selectionchange', () => {
            if (named) return;
            const sel = String(document.getSelection() || '').trim();
            if (sel !== 'Erik') return;
            named = true;
            console.log('%cthat\u2019s me.',
                'color: #9a9590; font-size: 12px; font-style: italic; font-family: system-ui, -apple-system, sans-serif;');
        });

        // Dock magnification: each icon grows with the pointer's distance
        // from its centre, cosine falloff, eased per frame so entering and
        // leaving the row ramps instead of snapping.
        const dock = document.querySelector('.dock');
        const dockIcons = [...dock.querySelectorAll('.dock-icon')];
        if (matchMedia('(hover: hover) and (pointer: fine)').matches &&
            !matchMedia('(prefers-reduced-motion: reduce)').matches) {
            const PEAK = 1.55, REACH = 2.3; // max scale; falloff radius in icon pitches
            const cur = dockIcons.map(() => 1);
            let mx = null, raf = 0;
            const frame = () => {
                raf = 0;
                const cs = getComputedStyle(dock);
                const reach = (parseFloat(cs.getPropertyValue('--size')) + parseFloat(cs.columnGap)) * REACH;
                const mids = dockIcons.map((a) => { const r = a.getBoundingClientRect(); return r.left + r.width / 2; });
                let moving = false;
                dockIcons.forEach((a, i) => {
                    let want = 1;
                    if (mx !== null) {
                        const d = Math.min(1, Math.abs(mx - mids[i]) / reach);
                        want = 1 + (PEAK - 1) * 0.5 * (1 + Math.cos(Math.PI * d));
                    }
                    cur[i] += (want - cur[i]) * 0.26;
                    if (Math.abs(want - cur[i]) < 0.002) cur[i] = want; else moving = true;
                    if (cur[i] === 1) a.style.removeProperty('--m');
                    else a.style.setProperty('--m', cur[i].toFixed(4));
                });
                if (moving) raf = requestAnimationFrame(frame);
            };
            const kick = () => { if (!raf) raf = requestAnimationFrame(frame); };
            dock.addEventListener('pointermove', (e) => { if (e.pointerType !== 'touch') { mx = e.clientX; kick(); } });
            dock.addEventListener('pointerleave', () => { mx = null; kick(); });
        }

        // Launch: the clicked icon bounces like a dock launch.
        dockIcons.forEach((a) => {
            a.addEventListener('click', () => {
                a.classList.remove('launch');
                void a.offsetWidth;
                a.classList.add('launch');
            });
            a.addEventListener('animationend', (e) => {
                if (e.animationName === 'launch') a.classList.remove('launch');
            });
        });

        // Easter egg: the console has a shell. ls() lists the dock,
        // ls('-a') shows what's hidden, cd() goes places.
        {
            const muted = 'color: #9a9590; font-size: 12px; font-family: ui-monospace, Menlo, monospace;';
            const plain = 'color: inherit; font-size: 12px; font-family: ui-monospace, Menlo, monospace;';
            const rows = [
                ['brandplant/', 'first company. sold.', 'brandplant.co'],
                ['spotify/', 'always playing', 'open.spotify.com'],
                ['fluencify/', 'creators, paid to create', 'fluencify.io'],
                ['knownotes/', 'ai notes for students', 'knownotes.ai'],
                ['instagram/', '900k and counting', 'instagram.com'],
                ['tiktok/', 'short form', 'tiktok.com'],
            ];
            window.ls = (flag) => {
                const all = flag === '-a' || flag === '-la' || flag === '-al';
                const list = all ? [['./', '', ''], ['../', '', ''], ...rows, ['.graveyard/', 'brandplant', '/graveyard']] : rows;
                console.log('%ctotal ' + list.length, muted);
                for (const [n, d, u] of list) {
                    const hidden = n.startsWith('.');
                    console.log('%c' + (hidden && n.length > 3 ? 'drwx------' : 'drwxr-xr-x') + '  erik  %c' + n.padEnd(13) + '%c' + d.padEnd(30) + u,
                        muted, plain, muted);
                }
                if (!all) console.log('%c(some things are hidden.)', muted + ' font-style: italic;');
            };
            window.cd = (dir = '~') => {
                const d = String(dir).replace(/^\.?\/?|\/$/g, '');
                if (d === '' || d === '~' || d === '.') return console.log('%calready home.', muted);
                if (d === 'graveyard' || d === '.graveyard') return void (location.href = '/graveyard/');
                if (d === 'about') return void (location.href = '/about/');
                const hit = rows.find(([n]) => n === d + '/');
                if (hit) return void window.open('https://' + hit[2], '_blank', 'noopener');
                console.log('%ccd: no such directory: ' + d, muted);
            };
        }

    </script>
